<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Others</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; 
           script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com data: filesystem:;
           connect-src 'self' https://yields.llama.fi/pools;
           style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; 
           font-src 'self' https://cdn.jsdelivr.net;
           img-src 'self' data: filesystem:" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/ethy.css">
</head>

<body class="container mt-4">

    <h2 class="mb-3">📊 Yield Farming - Others</h2>
    <button id="darkBtn" class="col">Dark Mode</button>

    <div class="row mb-3">
        <div class="col-md-4">
            <label for="networkFilter" class="form-label">Filtrar por Red:</label>
            <select id="networkFilter" class="form-select">
                <option value="all">Todas</option>
            </select>
        </div>
        <div class="col-md-4">
            <label for="platformFilter" class="form-label">Filtrar por Plataforma:</label>
            <select id="platformFilter" class="form-select">
                <option value="all">Todas</option>
            </select>
        </div>
        <div class="col-md-4">
            <label for="apyFilter" class="form-label">Mostrar APY mayor a:</label>
            <select id="apyFilter" class="form-select">
                <option value="10" selected>All</option>
                <option value="14">14%</option>
                <option value="18">18%</option>
            </select>
        </div>
        <div class="col-md-4">
            <label for="sortFilter" class="form-label">Ordenar por:</label>
            <select id="sortFilter" class="form-select">
                <option value="apy-desc" selected>APY: Mayor a Menor</option>
                <option value="apy-asc">APY: Menor a Mayor</option>
                <option value="name-asc">Plataforma: A-Z</option>
                <option value="name-desc">Plataforma: Z-A</option>
            </select>
        </div>
        <!--<div class="col-md-4">
            <label for="tickerFilter" class="form-label">Ticker:</label>
            <select id="tickerFilter" class="form-select">
                <option value="all" selected>Todos</option>
                <option value="USDS">USDS</option>
                <option value="CRVUSD">CRVUSD</option>
                <option value="USR">USR</option>
                <option value="USDE">USDE</option>
                <option value="USDAI">USDAI</option>
                <option value="SIGMASP">SIGMASP</option>
                <option value="USD1">USD1</option>
            </select>
        </div>-->
    </div>

    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Site</th>
                <th>Ticker</th>
                <th>Network</th>
                <th>APY (%)</th>
                <th>Asign</th>
            </tr>
        </thead>
        <tbody id="yield-table">
            <tr>
                <td colspan="4">Loading data...</td>
            </tr>
        </tbody>
    </table>

    <div id="apyChart"></div>
    <button id="homeBtn" class="btnSections">Home</button>
    <button id="stablesBtn" class="btnSections">Stables</button>
    <div id="qr-code"></div>
    <div id="secret-code"></div>
    <script src="../lib/lightw-charts.standa.prod.js"></script>
    <script src="../lib/bootstrap.bundle.min.js"></script>
    <script src="../cordova.js"></script>
    <script type="text/javascript" src="../lib/SharedService.js"></script>
    <script src="../js/othersy.js"></script>
</body>

</html>
