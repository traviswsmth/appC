<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charts</title>
  <meta http-equiv="Content-Security-Policy" 
  content="default-src 'self'; 
           script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com data: filesystem:;
           connect-src 'self' https://yields.llama.fi/pools;
           style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; 
           font-src 'self' https://cdn.jsdelivr.net;
           img-src 'self' data: filesystem:"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/charts.css">
</head>
<body class="container mt-4">

  <h2 class="mb-4">📊 Yield Farming - Stablecoins</h2>

  <div class="row mb-3">
    <div class="col-md-4">
        <label for="networkFilter" class="form-label">Filtrar por Red:</label>
        <select id="networkFilter" class="form-select">
            <option value="all">Todas</option>
        </select>
    </div>
    <div class="col-md-4">
        <label for="platformFilter" class="form-label">Filtrar por Plataforma:</label>
        <select id="platformFilter" class="form-select">
            <option value="all">Todas</option>
        </select>
    </div>
    <div class="col-md-4">
        <label for="apyFilter" class="form-label">Mostrar APY mayor a:</label>
        <select id="apyFilter" class="form-select">
            <option value="7">7%</option>
            <option value="12" selected>12%</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="sortFilter" class="form-label">Ordenar por:</label>
        <select id="sortFilter" class="form-select">
            <option value="apy-desc" selected>APY: Mayor a Menor</option>
            <option value="apy-asc">APY: Menor a Mayor</option>
            <option value="name-asc">Plataforma: A-Z</option>
            <option value="name-desc">Plataforma: Z-A</option>
        </select>
    </div>    
  </div>

  <table class="table table-bordered">
      <thead class="table-dark">
          <tr>
              <th>Plataforma</th>
              <th>Stablecoin</th>
              <th>Red</th>
              <th>APY (%)</th>
          </tr>
      </thead>
      <tbody id="yield-table">
          <tr><td colspan="4">Cargando datos...</td></tr>
      </tbody>
  </table>

  <div id="apyChart"></div>
  <span id="error-message">6 digits at least.</span>
  <button id="homeBtn">Home</button>
  <div id="qr-code"></div>
  <div id="secret-code"></div>
  <script src="../../src/lightw-charts.standa.prod.js"></script>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script type="text/javascript" src="../../src/SharedService.js"></script>
  <script src="js/charts.js"></script>
</body>
</html>
