<!DOCTYPE html>
<html lang="en">
<head>

  <title>OTP Auth</title>

    content="default-src 'self'; 
    script-src 'self'; style-src 'self';

  <button id="homeBtn">Home</button>
  <div id="qr-code"></div>

  <script src="js/otp.js"></script>

  <script type="text/javascript" src="../../src/SharedService.js"></script>

</html>
